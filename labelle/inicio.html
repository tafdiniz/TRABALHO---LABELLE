<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Belle — Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #44170E;
      --bg-cream: #E6D7C8;
      --text-brown: #4A1C13;
      --text-cream: #F6ECE1;
      --shadow-soft: 0 12px 28px rgba(24, 6, 3, 0.28), 0 4px 10px rgba(24, 6, 3, 0.16);
      --shadow-hover: 0 16px 34px rgba(24, 6, 3, 0.36), 0 6px 14px rgba(24, 6, 3, 0.22);
      --shadow-photo: 0 18px 38px rgba(18, 4, 2, 0.38), 0 6px 14px rgba(18, 4, 2, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-cream);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .hero-top {
      position: relative;
      width: 100%;
      height: 62vh;
      min-height: 420px;
      background-color: var(--bg-cream);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px 48px 34px;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
      z-index: 1;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(235, 221, 207, 0.86) 0%, rgba(235, 221, 207, 0.38) 38%, rgba(235, 221, 207, 0.08) 70%, rgba(235, 221, 207, 0.22) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .top-bar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      width: 100%;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      max-width: 480px;
    }

    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 5.2rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      line-height: 0.92;
      color: var(--text-brown);
      text-shadow: 0 2px 12px rgba(255, 250, 245, 0.55);
    }

    .brand-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.55rem;
      line-height: 1.2;
      color: var(--text-brown);
      margin-top: 8px;
      max-width: 390px;
      text-shadow: 0 1px 8px rgba(255, 250, 245, 0.65);
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-top: 6px;
    }

    .icon-btn {
      background: rgba(255, 250, 245, 0.25);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(74, 28, 19, 0.18);
      color: #FFFFFF;
      cursor: pointer;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(68, 23, 14, 0.14);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .icon-btn:hover {
      background-color: rgba(74, 28, 19, 0.25);
      transform: translateY(-2px);
    }

    .divider-strip {
      width: 100%;
      height: 14px;
      background-color: var(--bg-dark);
      border-bottom: 1px solid rgba(246, 236, 225, 0.22);
      box-shadow: 0 -4px 16px rgba(38, 11, 6, 0.18);
      position: relative;
      z-index: 4;
    }

    .hero-bottom {
      flex: 1;
      background-color: var(--bg-dark);
      padding: 28px 48px 34px;
      display: grid;
      grid-template-columns: 0.72fr 1.48fr;
      gap: 36px;
      align-items: center;
    }

    .bottom-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
    }

    .bottom-headline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.35rem;
      font-weight: 700;
      line-height: 1.12;
      color: var(--text-cream);
      max-width: 310px;
    }

    .home-card-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 24px;
      min-width: 245px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(246, 236, 225, 0.75);
      border-radius: 10px;
      color: var(--text-cream);
      text-decoration: none;
      box-shadow: var(--shadow-soft);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .home-card-btn:hover {
      background-color: rgba(246, 236, 225, 0.12);
      border-color: #FFFFFF;
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .home-card-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .home-card-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1;
      color: #FFFFFF;
    }

    .home-card-sub {
      font-size: 0.88rem;
      color: #E8D7C8;
      margin-top: 3px;
    }

    .cafe-photo-frame {
      width: 100%;
      height: 235px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(246, 236, 225, 0.22);
      box-shadow: var(--shadow-photo);
      background-color: #2A0E08;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .cafe-photo-frame:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 44px rgba(12, 3, 1, 0.45), 0 8px 18px rgba(12, 3, 1, 0.28);
    }

    .cafe-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    @media (max-width: 960px) {
      .hero-top {
        padding: 22px 24px;
        height: 52vh;
      }
      .brand-title {
        font-size: 3.6rem;
      }
      .hero-bottom {
        grid-template-columns: 1fr;
        padding: 26px 24px 32px;
      }
    }
  </style>
</head>
<body>

  <section class="hero-top">
    <img class="hero-bg" src="sobremesa-capa.jpg" alt="Sobremesa artesanal da cafeteria La Belle" />
    <div class="hero-overlay"></div>

    <div class="top-bar">
      <div class="brand-block">
        <h1 class="brand-title">LA BELLE</h1>
        <p class="brand-tagline">Onde as páginas ganham sabor e a música vira sobremesa.</p>
      </div>

      <div class="header-icons">
        <button class="icon-btn" title="Pedidos e Reservas" onclick="window.location.href='cardapio.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="4" rx="1"/>
            <path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/>
            <path d="M10 12h4"/>
          </svg>
        </button>
        <button class="icon-btn" title="Explorar" onclick="window.location.href='home.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5"/>
            <path d="M5 9.5V20h14V9.5"/>
            <path d="M10 20v-6h4v6"/>
          </svg>
        </button>
        <button class="icon-btn" title="Login e Cadastro" onclick="window.location.href='index.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M5 20c1.5-4 12.5-4 14 0"/>
          </svg>
        </button>
      </div>
    </div>
  </section>

  <div class="divider-strip"></div>

  <section class="hero-bottom">
    <div class="bottom-left">
      <h2 class="bottom-headline">Um lugar para sentir, descobrir e saborear.</h2>

      <a href="home.html" class="home-card-btn">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V20h14V9.5"/>
          <path d="M10 20v-6h4v6"/>
        </svg>
        <div class="home-card-info">
          <span class="home-card-title">Home</span>
          <span class="home-card-sub">Nossa Loja</span>
        </div>
      </a>
    </div>

    <div class="cafe-photo-frame">
      <img src="espaco-labelle.jpg" alt="Ambiente interno da cafeteria e livraria La Belle" />
    </div>
  </section>

</body>
</html>
